name: Build Electron App (Windows x86)

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  workflow_dispatch:

jobs:
  build-windows-x86:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Electron app for Windows x86
        run: bun run build
        env:
          npm_config_target_arch: ia32
          npm_config_target_platform: win32
          npm_config_arch: ia32
          CI: true

      - name: List build output (debug)
        run: |
          echo "Contents of current directory:"
          dir
          echo "Looking for dist directory:"
          if (Test-Path "dist") { dir dist -Recurse } else { echo "dist directory not found" }
          echo "Looking for build directory:"
          if (Test-Path "build") { dir build -Recurse } else { echo "build directory not found" }
          echo "Looking for out directory:"
          if (Test-Path "out") { dir out -Recurse } else { echo "out directory not found" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-app-windows-x86
          path: |
            dist/
            build/
            out/
          retention-days: 30
        if: always()
