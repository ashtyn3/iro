name: Build Electron App (Windows x86)

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  workflow_dispatch:

jobs:
  build-windows-x86:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app for Windows x86
        run: npm run build
        env:
          npm_config_target_arch: ia32
          npm_config_target_platform: win32
          npm_config_arch: ia32
          CI: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-app-windows-x86
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.zip
          retention-days: 30
